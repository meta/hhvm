name: windows

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      SCCACHE_GHA_ENABLED: "on"
      # sccache caches cargo's crates too, and keeps one server, so the stats
      # at the end cover the whole build.
      RUSTC_WRAPPER: sccache
      SCCACHE_IDLE_TIMEOUT: "0"
      # vcpkg keeps the packages it builds here, which the cache below saves.
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-archives
    steps:

    # The build fetches fbthrift with git, and its checkout has paths past
    # MAX_PATH.
    - name: Fix Git config
      run: >
        git config --system core.longpaths true &&
        git config --system core.autocrlf false &&
        git config --system core.symlinks true
      shell: cmd

    - uses: actions/checkout@v6

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.14.0"

    # Ports change with the image's vcpkg, so its commit keys the cache.
    - name: Create the vcpkg binary cache
      id: vcpkg
      run: |
        mkdir C:\vcpkg-archives
        "commit=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" >> $env:GITHUB_OUTPUT
    - uses: actions/cache/restore@v6
      id: vcpkg-cache
      with:
        path: C:\vcpkg-archives
        key: vcpkg-${{ steps.vcpkg.outputs.commit }}-zlib-zstd-gflags-openssl-pcre2-xxhash-libsodium

    # fizz, fbthrift and fb303 build only against installed copies of these.
    # They are static libraries with the dynamic CRT, except libsodium, which
    # is a DLL. The build fetches the rest, folly, libevent and Boost among
    # them. vcpkg comes with the image; libsodium's bin directory goes on PATH
    # for its DLL. pcre2's JIT feature looks up its sljit submodule through
    # GitHub's API, so it's left out.
    - name: Install dependencies
      run: >
        vcpkg install --triplet x64-windows-static-md
        zlib zstd gflags openssl pcre2[core] xxhash &&
        vcpkg install --triplet x64-windows libsodium &&
        echo %VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin>> %GITHUB_PATH%
      shell: cmd
    # actions/cache saves at the end of the job, and only if every step passed.
    # Saving here keeps the packages for the next run when the build fails.
    - uses: actions/cache/save@v6
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      with:
        path: C:\vcpkg-archives
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    - name: Install Rust Stable
      uses: dtolnay/rust-toolchain@stable

    # pywatchman's extension builds with setuptools, which Python 3.12 no
    # longer installs by default.
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: "3.12"
    - name: Install Python modules
      run: pip install setuptools

    # Only the developer environment puts cl.exe, ml64 and ninja on PATH. It
    # also repoints VCPKG_ROOT at Visual Studio's own vcpkg, so the steps below
    # name the image's, which installed the dependencies.
    - uses: ilammy/msvc-dev-cmd@v1

    # Ninja keeps this single-config like the other platforms, and unlike the
    # Visual Studio generator it honours the compiler launcher that sccache
    # needs. vcpkg's toolchain file finds the static libraries under the names
    # their static builds have, such as zlib's zs.lib.
    #
    # RelWithDebInfo defaults to /Zi, whose shared .pdb breaks under sccache.
    # Embedded (/Z7) keeps debug info in each object. CMP0141 enables the
    # setting.
    - name: Configure
      run: >
        cmake -B _build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
        -DCMAKE_PREFIX_PATH=%VCPKG_INSTALLATION_ROOT%/installed/x64-windows
        -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
        -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      shell: cmd

    # A bare -j leaves it to Ninja, which runs cores + 2 jobs, too many for the
    # memory of this 4-vCPU runner.
    - name: Build
      run: cmake --build _build -j 4

    # As on the other platforms, retry failures: the integration tests' timing
    # varies on loaded machines. A hung test fails after 10 minutes instead
    # of holding the job until its timeout.
    - name: Test
      run: >
        ctest --test-dir _build --output-on-failure -j 4
        --repeat until-pass:3 --timeout 600

    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
