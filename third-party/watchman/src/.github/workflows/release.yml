name: release

on:
  push:
    tags:
    - v*

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  build:
    uses: ./.github/workflows/linux.yml
    with:
      release: ${{ github.ref_name }}

  # Creating the release only once its packages exist keeps the latest release
  # one with binaries.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  #  to create the release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: linux-packages
        path: dist
    - name: Create the release
      run: >
        gh release view "$TAG"
        || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
    - name: Upload the packages
      run: gh release upload "$TAG" dist/* --clobber
