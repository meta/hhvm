name: macos

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  # release.yml calls this to package a release.
  workflow_call:
    inputs:
      release:
        description: The release's name, such as its tag
        type: string
        default: ""

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "on"
      # sccache caches cargo's crates too, and keeps one server, so the stats
      # at the end cover the whole build.
      RUSTC_WRAPPER: sccache
      SCCACHE_IDLE_TIMEOUT: "0"
      # The C in Rust crates otherwise targets the SDK's macOS version, newer
      # than the one CMake links for, and ld warns about every such object.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:

    - uses: actions/checkout@v6

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.14.0"

    # fizz, fbthrift, fb303 and edencommon build only against installed copies
    # of these. The macOS SDK has zlib. The build fetches the rest, folly and
    # Boost among them. The build uses the OpenSSL that Homebrew has linked,
    # openssl@4 on this image.
    - name: Install system deps
      run: >
        brew install
        gflags libevent libsodium ninja openssl@4 pcre2 pkgconf xxhash zstd

    - name: Install Rust Stable
      uses: dtolnay/rust-toolchain@stable

    # pywatchman's extension builds with setuptools, which Python 3.12 no
    # longer installs by default.
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install Python modules
      run: pip install setuptools

    # This builds the release binaries: they link Homebrew's libraries
    # statically, so they need only macOS itself.
    - name: Configure
      run: >
        cmake -B _build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_PROJECT_INCLUDE="$PWD/watchman/build/package/prefer-static.cmake"
        -DPython3_EXECUTABLE="$(which python)"
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build
      run: cmake --build _build -j "$(sysctl -n hw.ncpu)"

    # Like getdeps' test step, retry failures: the integration tests' timing
    # varies on loaded machines. A hung test fails after 10 minutes instead
    # of holding the job until its timeout.
    - name: Test
      run: >
        ctest --test-dir _build --output-on-failure -j "$(sysctl -n hw.ncpu)"
        --repeat until-pass:3 --timeout 600

    - name: Package
      env:
        RELEASE: ${{ inputs.release || 'ci' }}
      run: ./watchman/build/package/package-macos.sh _build "$RELEASE" _packages
    - uses: actions/upload-artifact@v6
      if: inputs.release != ''
      with:
        name: macos-packages
        path: _packages

    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
