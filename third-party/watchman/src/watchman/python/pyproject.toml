[project]
name = "pywatchman"
version = "4.0.1"
authors = [
    { name = "Meta Source Control Team", email = "sourcecontrol-dev@fb.com" },
]
description = "Watchman client for Python"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: System :: Filesystems",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "watchman",
    "inotify",
    "fsevents",
    "kevent",
    "kqueue",
    "portfs",
    "filesystem",
    "watcher",
]

[project.scripts]
watchman-diag = "pywatchman.watchman_diag:main"
watchman-make = "pywatchman.watchman_make:main"
watchman-replicate-subscription = "pywatchman.watchman_replicate_subscription:main"
watchman-wait = "pywatchman.watchman_wait:main"

[project.urls]
Homepage = "https://github.com/meta/watchman"
Issues = "https://github.com/meta/watchman/issues"


[build-system]
requires = ["setuptools>=61.0", "wheel>=0.37.0"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# 64-bit only: x86_64 and aarch64 on Linux, arm64 on macOS, AMD64 on Windows.
archs = ["auto64"]
# bser doesn't declare that it is safe without the GIL, so a free-threaded
# Python turns the GIL back on to load it, with a warning.
skip = ["cp3??t-*"]
test-command = "python {package}/tests/tests.py"

[tool.cibuildwheel.windows]
# tests.py isn't run on Windows anywhere else. This checks that the wheel
# installs and that pip's launcher starts a tool.
test-command = "watchman-wait --help"
