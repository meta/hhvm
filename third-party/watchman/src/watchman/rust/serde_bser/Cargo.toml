[package]
name = "serde_bser"
version = "0.4.0"
authors = ["Rain <rain1@fb.com>", "Wez Furlong"]
edition = "2021"
description = "Implements the Watchman BSER encoding for serde. https://meta.github.io/watchman/docs/bser.html"
documentation = "https://docs.rs/serde_bser"
repository = "https://github.com/meta/watchman/"
license = "MIT"

[dependencies]
anyhow = "1.0"
byteorder = "1.3"
bytes = { version = "1.9", features = ["serde"] }
serde = { version = "1.0.126", features = ["derive", "rc"] }
serde_bytes = "0.11"
thiserror = "2.0"

[dev-dependencies]
maplit = "1.0"

[features]
debug_bytes = []
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fbcode_build)"] }
