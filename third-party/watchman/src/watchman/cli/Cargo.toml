# @generated by autocargo from //watchman/cli:cli

[package]
name = "watchmanctl"
version = "0.1.0"
authors = ["Source Control Oncall oncall+source_control@xmail.facebook.com"]
edition = "2024"
repository = "https://github.com/facebook/watchman"
license = "MIT"

[dependencies]
ahash = { version = "0.8.11", features = ["runtime-rng"] }
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
duct = "0.13.7"
jwalk = "0.8.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
sysinfo = "0.39.6"
tabular = "0.2.0"
tokio = { version = "1.53.2", features = ["full", "test-util", "tracing"] }
watchman_client = { version = "0.9.0", path = "../rust/watchman_client" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }

[features]
default = []
fb = []
